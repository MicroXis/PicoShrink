name: Build PicoShrink

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Package
        run: cargo packager --release --formats appimage,deb

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: picoshrink-linux
          path: |
            target/release/*.AppImage
            target/release/*.deb

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Package
        run: cargo packager --release --formats nsis

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: picoshrink-windows
          path: target/release/*.exe

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Package
        run: cargo packager --release --formats dmg

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: picoshrink-macos
          path: target/release/*.dmg
